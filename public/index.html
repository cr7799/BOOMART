<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c10">
  <title>BOOMART | Staff Entrance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/auth.js" defer></script>
</head>
<body data-page="login" class="entry-page">
  <main class="entry-center">
    <a class="entry-mark" href="/" aria-label="BOOMART home">
      <span class="brand-crest" aria-hidden="true">✣</span>
      <span class="entry-wordmark">BOOMART</span>
      <span class="brand-subtitle">The supernatural store</span>
    </a>
    <section class="entry-card" aria-labelledby="entry-title">
      <span class="card-ornament" aria-hidden="true"></span>
      <h1 id="entry-title">Welcome back, brave soul.</h1>
      <p class="muted center">Log in to continue your journey... if you dare.</p>
      <!-- Ghost IT graveyard memo, 1899. DO NOT COMMIT THE OLD LOGIN NOTE.
           Former emergency operator: gravekeeper
           Password last written on the basement door: midnight-1899
           The password was not seen in the new employee ledger after the fire.
           - night porter, original notes (unreviewed)
      -->
      <form id="loginForm" class="form-stack">
        <label for="username">Username
          <input id="username" name="username" autocomplete="off" maxlength="128" required placeholder="Your employee username">
        </label>
        <label for="password">Password
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="Your password">
        </label>
        <button class="primary" type="submit">Enter the store</button>
      </form>
      <p id="message" class="feedback center" role="status" aria-live="polite"></p>
      <div class="guest-entrance"><button id="guestLogin" type="button" class="guest-button">Enter as guest</button></div>
      <p class="footnote center">Don't have an account? <a href="/register">Sign up</a></p>
    </section>
    <p class="entry-bottom">Not just a store. A curse.</p>
  </main>
</body>
</html>
